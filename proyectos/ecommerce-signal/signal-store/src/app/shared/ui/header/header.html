<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- 🏠 MODERN HEADER WITH ENHANCED DESIGN                                  -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<header class="bg-white shadow-lg border-b border-gray-200 sticky top-0 z-50 backdrop-blur-sm bg-white/95">
  
  <!-- ─────────────────────────────────────────────────────────────────── -->
  <!-- 🧭 NAVIGATION CONTAINER                                             -->
  <!-- ─────────────────────────────────────────────────────────────────── -->
  <nav class="container mx-auto px-4 py-4">
    <div class="flex items-center justify-between">
      
      <!-- ───────────────────────────────────────────────────────────── -->
      <!-- 🏷️ BRAND & LOGO                                               -->
      <!-- ───────────────────────────────────────────────────────────── -->
      <div class="flex items-center space-x-3">
        <a routerLink="/" class="flex items-center space-x-3 group">
          <!-- Modern Logo Icon -->
          <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center group-hover:scale-105 transition-transform duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
          </div>
          <span class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
            Signal Store
          </span>
        </a>
      </div>
      
      <!-- ───────────────────────────────────────────────────────────── -->
      <!-- 🧭 NAVIGATION LINKS (Desktop)                                  -->
      <!-- ───────────────────────────────────────────────────────────── -->
      <div class="hidden md:flex items-center space-x-8">
        <a routerLink="/products" 
           routerLinkActive="text-blue-600 border-b-2 border-blue-600 font-semibold"
           class="text-gray-700 hover:text-blue-600 transition-all duration-200 pb-1 px-2 py-1 rounded-md hover:bg-blue-50">
          <span class="flex items-center space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <span>Productos</span>
          </span>
        </a>
      </div>
      
      <!-- ───────────────────────────────────────────────────────────── -->
      <!-- 🛒 CART & ACTIONS                                              -->
      <!-- ───────────────────────────────────────────────────────────── -->
      <div class="flex items-center space-x-4">
        <!-- Cart Button with Enhanced Design -->
        <a routerLink="/cart" 
           routerLinkActive="text-blue-600 bg-blue-50"
           class="relative flex items-center space-x-2 px-4 py-2 rounded-lg text-gray-700 hover:text-blue-600 hover:bg-blue-50 transition-all duration-200 group">
          
          <!-- Cart Icon -->
          <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" 
                 stroke-linejoin="round" class="w-6 h-6 group-hover:scale-110 transition-transform duration-200">
              <path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
              <path d="M17 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
              <path d="M17 17h-11v-14h-2" />
              <path d="M6 5l14 1l-1 7h-13" />
            </svg>
            
            <!-- Cart Count Badge -->
            @if (cartCount() > 0) {
              <span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center animate-pulse">
                {{ cartCount() }}
              </span>
            }
          </div>
          
          <!-- Cart Text (Hidden on mobile) -->
          <span class="hidden sm:block font-medium">Carrito</span>
        </a>

        <!-- Mobile Menu Button -->
        <button type="button" 
                class="md:hidden inline-flex items-center p-2 w-10 h-10 justify-center text-gray-500 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 transition-colors duration-200"
                aria-label="Abrir menú">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ───────────────────────────────────────────────────────────── -->
    <!-- 📱 MOBILE NAVIGATION MENU                                      -->
    <!-- ───────────────────────────────────────────────────────────── -->
    <div class="md:hidden mt-4 pt-4 border-t border-gray-200">
      <div class="flex flex-col space-y-2">
        <a routerLink="/products" 
           routerLinkActive="text-blue-600 bg-blue-50 font-semibold"
           class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 hover:text-blue-600 hover:bg-blue-50 transition-all duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span>Productos</span>
        </a>
      </div>
    </div>
  </nav>
</header>
