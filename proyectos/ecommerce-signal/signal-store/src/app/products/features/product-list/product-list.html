<div class="mx-auto max-w-screen-xl px-4 py-8">
  @switch (productState.state.status()) {

    @case ("loading") {
    <div class="flex justify-center items-center py-12">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
      <p class="ml-3 text-lg font-medium text-gray-700">Cargando productos...</p>
    </div>
    }

    @case ("error") {
    <div class="text-center py-12">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
        <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
        </svg>
      </div>
      <h3 class="mt-2 text-lg font-semibold text-gray-900">Error al cargar los productos</h3>
      <p class="mt-1 text-sm text-gray-500">Por favor, intenta nuevamente más tarde.</p>
    </div>
    }
    
    @default {
    <!-- Products Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 justify-items-center mb-8">
      @for(product of productState.state().products; track product) {
      <app-product-card 
        class="block" 
        [product]="product" 
        (addToCart)="addToCart($event)" />
      }
    </div>

    <!-- Pagination -->
    <app-pagination
      [currentPage]="productState.state().currentPage"
      [totalItems]="productState.state().totalItems"
      [itemsPerPage]="productState.state().itemsPerPage"
      (pageChange)="onPageChange($event)"
    />
    }
  }
</div>
